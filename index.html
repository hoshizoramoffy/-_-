<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プレゼントページ</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #F3A3C3 !important;
        }
        body {
            color: #4A2E35;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .card {
            background: #ffffff !important;
            padding: 35px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(74, 46, 53, 0.15);
            display: block !important;
            box-sizing: border-box;
            margin: 0 auto;
        }
        h2 {
            font-size: 19px;
            margin-top: 0;
            margin-bottom: 20px;
            color: #FF5A8D;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }
        .success-title {
            color: #FF5A8D;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn-label {
            font-size: 12px;
            font-weight: bold;
            color: #4A2E35;
            margin-bottom: 8px;
        }
        .channel-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        /* 💡 修正：ボタンのピンクを明るく、視認性抜群に変更 */
        .sub-btn {
            flex: 1;
            display: inline-block;
            padding: 11px 10px;
            background-color: #FF5A8D;
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 8px rgba(255, 90, 141, 0.25);
            transition: background 0.2s;
        }
        .sub-btn:hover {
            background-color: #e04374;
        }
        .upload-zone {
            background: #fff5f7;
            padding: 15px 12px;
            border-radius: 15px;
            margin-bottom: 15px;
            font-size: 12px;
            border: 2px dashed #FF5A8D;
            box-sizing: border-box;
        }
        .upload-zone p {
            margin: 0 0 10px 0;
            font-weight: bold;
            color: #FF5A8D;
            line-height: 1.4;
        }
        .safe-file-input {
            font-size: 11px;
            color: #4A2E35;
            max-width: 100%;
        }
        .preview-area {
            margin-top: 10px;
            display: none;
        }
        .preview-area img {
            max-width: 100%;
            max-height: 100px;
            border-radius: 10px;
            border: 2px solid #fff5f7;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .input-guide {
            font-size: 13px;
            font-weight: bold;
            color: #FF5A8D;
            margin-top: 15px;
            margin-bottom: 8px;
            text-align: center;
        }
