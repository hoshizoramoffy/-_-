<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特典ゲットページ</title>
    <style>
        body { background-color: #FBAED2; color: #5c3a41; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: #ffffff; padding: 40px 30px; width: 100%; max-width: 400px; text-align: center; border-radius: 20px; box-shadow: 0 8px 20px rgba(251, 174, 210, 0.4); }
        h2 { color: #ff6b8b; margin-bottom: 20px; }
        
        /* チャンネル登録誘導エリア */
        .funnel-box { background: #fff0f3; padding: 20px; border-radius: 15px; margin-bottom: 25px; text-align: left; border: 2px solid #ff8ca3; }
        .check-item { display: block; margin: 10px 0; font-weight: bold; cursor: pointer; }
        .sub-btn { display: block; background: #ff0000; color: white; padding: 10px; text-decoration: none; border-radius: 5px; font-weight: bold; margin: 5px 0 15px 0; text-align: center; }
        
        .pwd-input { padding: 12px; width: 80%; border: 2px solid #ffe3e8; border-radius: 30px; text-align: center; margin-bottom: 15px; outline: none; }
        .open-btn { padding: 12px 35px; border: none; border-radius: 30px; background: #ff8ca3; color: white; font-weight: bold; cursor: pointer; }
        
        #secret-area { display: none; }
        #secret-area img { max-width: 100%; border-radius: 15px; margin: 20px 0; }
        .yt-btn { display: inline-block; padding: 10px 20px; background: #ff6b8b; color: white; text-decoration: none; border-radius: 20px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div id="input-stage">
        <h2>🍓 特典獲得への道 🍓</h2>
        <div class="funnel-box">
            <p>STEP 1: チャンネル登録</p>
            <a href="https://youtube.com/@masirooukoku" class="sub-btn" target="_blank">真白ぴんくを登録！</a>
            <a href="https://youtube.com/@hoshizoramoffy" class="sub-btn" target="_blank">もっふぃを登録！</a>
            <p>STEP 2: チェックを入れる</p>
            <label class="check-item"><input type="checkbox" id="check-m"> 真白ぴんく登録済み</label>
            <label class="check-item"><input type="checkbox" id="check-o"> もっふぃ登録済み</label>
        </div>
        <input type="text" id="password-input" class="pwd-input" placeholder="合言葉を入力">
        <br>
        <button class="open-btn" onclick="checkPassword()">特典をひらく！</button>
    </div>

    <div id="secret-area">
        <h3>せいかい！おめでとう 🍓</h3>
        <img src="present.jpg" alt="特典画像">
        <p>画像を長押しで保存してね！</p>
        <a href="https://youtube.com/@masirooukoku" class="yt-btn" target="_blank">真白ぴんく 👑</a>
        <a href="https://youtube.com/@hoshizoramoffy" class="yt-btn" target="_blank">もっふぃ 🧸</a>
    </div>
</div>

<script>
function checkPassword() {
    let input = document.getElementById('password-input').value.trim();
    // カタカナひらがな変換
    input = input.replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60));
    
    const c1 = document.getElementById('check-m').checked;
    const c2 = document.getElementById('check-o').checked;

    if (!c1 || !c2) {
        alert('まずは2人のチャンネル登録をお願いします！');
        return;
    }
    if (input === 'だいすき') {
        document.getElementById('input-stage').style.display = 'none';
        document.getElementById('secret-area').style.display = 'block';
    } else {
        alert('合言葉が違うみたい…動画をもう一度見てみてね！');
    }
}
</script>
</body>
</html>
